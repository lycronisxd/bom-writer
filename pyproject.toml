[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-writer"
version = "0.1.0"
description = "a simple cli tool for creating and converting bills of materials."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "andrei acatalinei" }
]

[project.scripts]
bom-writer = "bom_writer.cli:main"